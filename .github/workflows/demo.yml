name: demo-loop (CPU smoke test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch (CPU) and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest pyflakes
      - name: Static check and unit tests
        run: |
          python -m pyflakes scripts/*.py
          python -m pytest -q tests
      - name: Run the two-round loop on tiny synthetic data (with protected narrowing on)
        run: |
          python scripts/demo_loop.py --root demo_runs --no-pretrained --size 256 --n-labelled 4 --n-pool 3 --n-test 2 --epochs 2 --steps 15 --erode 1
          cat demo_runs/report/report.md
      - name: Check that the report contains three metric rows in [0, 1]
        run: |
          python - <<'PY'
          import re, sys
          rows = [l for l in open("demo_runs/report/report.md", encoding="utf-8") if l.startswith("| pool") or l.startswith("| test")]
          assert len(rows) == 3, rows
          for l in rows:
              vals = [float(v) for v in re.findall(r"\| ([01]\.\d{3}) ", l)]
              assert len(vals) == 4 and all(0.0 <= v <= 1.0 for v in vals), l
          print("report OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: demo_runs/report/
